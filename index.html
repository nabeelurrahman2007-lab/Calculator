
<!DOCTYPE html> 
<html> 
<head> 
    <title>Calculator</title> 
 
    <style>         body {             background-color: lightgrey;             color: white;             font-family: Arial, sans-serif;             display: flex;             justify-content: center;             align-items: center;             height: 100vh;             margin: 0; 
        } 
 
        .calculator {             width: 255px;             background-color: lightblue;             padding: 15px;             border-radius: 5px; 
        } 
 
        .display {             height: 55px;             background-color: #222;             color: white; font-size: 30px; 
text-align: right; padding: 10px; 
            box-sizing: border-box;             border-radius: 8px 8px 0 0;             overflow: hidden; 
        } 
 
        .buttons {             display: grid;             grid-template-columns: repeat(4, 1fr); 
             
        } 
 
        button {             height: 38px;             border: 1px solid #ddd;             background-color: #f5f5f5;             color: black;             font-size: 17px;             cursor: pointer; 
        } 
 
        button:hover {             background-color: #ddd; 
        } 
 
        .equal {             height: auto;             align-self: stretch;             grid-column: 4; grid-row: 2 / 6; background-color: coral; 
 
        } 
 
        .equal:hover {             background-color: #ff7043; 
        } 
 
        .zero {             border-radius: 0 0 0 8px; 
        } 
    </style> 
</head> 
 
<body> 
 
    <div class="calculator"> 
        <div class="display" id="display">0</div> 
 
        <div class="buttons"> 
            <button onclick="setOperator('+')">+</button> 
            <button onclick="setOperator('-')">-</button> 
            <button onclick="setOperator('*')">x</button> 
            <button onclick="setOperator('/')">÷</button> 
 
            <button onclick="press('7')">7</button> 
            <button onclick="press('8')">8</button> 
            <button onclick="press('9')">9</button> 
            <button class="equal" onclick="calculate()">=</button> 
 
<button onclick="press('4')">4</button> 
<button onclick="press('5')">5</button> 
<button onclick="press('6')">6</button> 
 
            <button onclick="press('1')">1</button> 
            <button onclick="press('2')">2</button>             <button onclick="press('3')">3</button> 
 
            <button class="zero" onclick="press('0')">0</button> 
            <button onclick="press('.')">.</button> 
            <button onclick="clearDisplay()">AC</button> 
        </div> 
    </div> 
 
    <script>         let firstNumber = "";         let secondNumber = "";         let operator = "";         let newNumber = false; 
 
        function press(value) {             let display = document.getElementById("display"); 
 
            if (newNumber) {                 display.innerText = "0";                 newNumber = false; 
            } 
 
            if (display.innerText === "0" && value !== ".") {                 display.innerText = value; 
            } else if (value !== "." || !display.innerText.includes(".")) {                 display.innerText += value; 
} 
        } 
 
        function setOperator(op) {             firstNumber = displayValue();             operator = op;             newNumber = true; 
        } 
 
        function displayValue() {             return document.getElementById("display").innerText; 
        } 
 
        function calculate() {             secondNumber = displayValue(); 
 
            let a = Number(firstNumber);             let b = Number(secondNumber); 
            let result; 
 
            if (operator === "+") result = a + b;             else if (operator === "-") result = a - b;             else if (operator === "*") result = a * b;             else if (operator === "/") {                 result = b !== 0 ? a / b : "Error"; 
            } else {                 return; 
            } 
 
            document.getElementById("display").innerText = result;             firstNumber = result === "Error" ? "" : String(result); operator = "";             newNumber = true; 
        } 
 
        function clearDisplay() {             document.getElementById("display").innerText = "0";             firstNumber = "";             secondNumber = "";             operator = "";             newNumber = false; 
        } 
    </script> 
 
</body> 
</html>
